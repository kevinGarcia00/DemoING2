services:
  - type: web
    name: demoing2-api
    runtime: docker
    plan: free
    rootDir: backEnd
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: >-
      sh -c 'exec php -S 0.0.0.0:${PORT:-10000} -t /var/www/html /var/www/html/router.php'
    healthCheckPath: /api/health
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL_CA
        sync: false
      - key: DB_SSL
        value: "true"